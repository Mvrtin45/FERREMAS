{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago Exitoso - FerreMas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/logo.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style_bodeguero.css' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card bg-dark text-white shadow">
            <div class="card-header text-center">
                <h2>Pago Exitoso</h2>
            </div>
            <div class="card-body">
                <p class="mb-3">Su pago ha sido aprobado. Gracias por su compra.</p>
                <p>Detalle de la transacción:</p>
                <ul>
                    <li>Status: {{ response.status }}</li>
                    <li>Buy Order: {{ response.buy_order }}</li>
                    <li>Authorization Code: {{ response.authorization_code }}</li>
                </ul>
                <div class="text-end mt-4">
                    <a href="/" class="btn btn-success">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
