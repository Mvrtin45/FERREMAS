{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Error en el Pago - FerreMas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/logo.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style_bodeguero.css' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card bg-danger text-white shadow">
            <div class="card-header text-center">
                <h2>Error en el Pago</h2>
            </div>
            <div class="card-body">
                {% if error %}
                    <p class="mb-3">{{ error }}</p>
                {% else %}
                    <p class="mb-3">Ocurrió un problema durante el proceso de pago.</p>
                {% endif %}
                <p>Detalle de la respuesta:</p>
                <pre class="bg-light text-dark p-3 rounded">{{ response }}</pre>

                <div id="alerta-redireccion" class="alert alert-warning text-dark mt-4" role="alert">
                    Te redireccionaremos al carrito en <span id="contador">10</span> segundos...
                </div>
            </div>
        </div>
    </div>

    <script>
        let segundos = 5;
        const contador = document.getElementById('contador');

        const intervalo = setInterval(() => {
            segundos--;
            contador.textContent = segundos;
            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href =  '/api/carrito/' ;
            }
        }, 1000);
    </script>
</body>
</html>
