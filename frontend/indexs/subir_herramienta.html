{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Herramienta - FerreMas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/logo.jpg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style_bodeguero.css' %}">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card bg-dark text-white shadow">
            <div class="card-header text-center">
                <h2>Subir Nueva Herramienta</h2>
                {% if error_msg %}
                <div class="alert alert-danger" role="alert">
                   {{ error_msg }}
                </div>
                   {% endif %}
                </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id" class="form-label">ID</label>
                        <input type="text" class="form-control" name="id" id="id" required>
                    </div>

                    <div class="mb-3">
                        <label for="nombre_herramienta" class="form-label">Nombre de la Herramienta</label>
                        <input type="text" class="form-control" name="nombre_herramienta" id="nombre_herramienta" required>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select class="form-control" name="categoria" id="categoria" required>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}">{{ cat.nombre_categoria }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="precio" class="form-label">Precio</label>
                        <input type="number" step="0.01" class="form-control" name="precio" id="precio" required>
                    </div>

                    <div class="mb-3">
                        <label for="stock" class="form-label">Stock</label>
                        <input type="number" class="form-control" name="stock" id="stock" required>
                    </div>

                    <div class="mb-3">
                        <label for="imagen_herramienta" class="form-label">Imagen</label>
                        <input type="file" class="form-control" name="imagen_herramienta" id="imagen_herramienta">
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-success">Guardar herramienta</button>
                        <a href="{% url 'admin2' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
