{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Bodeguero - FerreMas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="{% static 'img/logo.jpg' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style_bodeguero.css' %}" />
</head>

<body>
    <main class="container">
        <h2>Panel del Bodeguero</h2>
        <h5>Órdenes de Despacho</h5>

        <div class="text-end">
            <a href="{% url 'subir_herramienta' %}" class="btn btn-success">
                Subir Herramienta
            </a>
        </div>

        <table class="table table-striped table-dark table-hover">
            <thead>
                <tr>
                    <th>ID Orden</th>
                    <th>Cliente</th>
                    <th>Productos</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaPedidos">
                <!-- Se llenará dinámicamente por JS -->
            </tbody>
        </table>
    </main>

    <script src="{% static 'js/bodeguero.js' %}"></script>
</body>

</html>
